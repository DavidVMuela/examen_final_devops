version: "3.8"

services:
  muela:
    image: ghcr.io/REPLACE_WITH_OWNER/muela:1.0.5
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"

        # --- REDIRECCIÓN HTTP → HTTPS ---
        - "traefik.http.routers.muela.entrypoints=http"
        - "traefik.http.routers.muela.rule=Host(`muela.byronrm.com`)"
        - "traefik.http.middlewares.muela-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.muela.middlewares=muela-https-redirect"

        # --- ROUTER HTTPS ---
        - "traefik.http.routers.muela-secure.entrypoints=https"
        - "traefik.http.routers.muela-secure.rule=Host(`muela.byronrm.com`)"
        - "traefik.http.routers.muela-secure.tls=true"
        - "traefik.http.routers.muela-secure.tls.certresolver=http"
        - "traefik.http.routers.muela-secure.service=muela"

        # Puerto interno real de tu app Flask → 8080
        - "traefik.http.services.muela.loadbalancer.server.port=8080"

        # Red de Traefik
        - "traefik.docker.network=traefik-public"

    networks:
      - traefik-public

networks:
  traefik-public:
    external: true