name: CI/CD Muela Project

on:
  push:
    branches: ["muela"]
  pull_request:
    branches: ["muela"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # ---------------------------------------------------------
    # 1. PREPARACIÓN Y TEST (Igual que antes)
    # ---------------------------------------------------------
    - name: 📥 Checkout repo
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🛠️ Fix Python path
      run: echo "PYTHONPATH=." >> $GITHUB_ENV
    
    - name: 🧪 Run tests
      run: pytest test_app.py -v
    
    # ---------------------------------------------------------
    # 2. CONSTRUIR IMAGEN (Igual que antes)
    # ---------------------------------------------------------
    - name: 🔐 Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🏗️ Build & Push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/davidvmuela/muela:1.0.5
          ghcr.io/davidvmuela/muela:latest
    
    # ---------------------------------------------------------
    # 3. DESPLIEGUE EN VPS (MODIFICADO: Sin SCP)
    # ---------------------------------------------------------
    - name: 🚀 Deploy to VPS via SSH (Git Pull Strategy)
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: 22   # Forzamos puerto 22 para evitar errores
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          echo "🔄 INICIANDO DESPLIEGUE..."
          
          # A. Asegurar que existe la carpeta del proyecto
          if [ ! -d "muela-app" ]; then
            echo "📂 Clonando repositorio por primera vez..."
            git clone https://github.com/DavidVMuela/examen_final_devops.git muela-app
          fi
          
          cd muela-app
          
          # B. Forzar la descarga de la rama 'muela' para tener el stack.yml actualizado
          echo "⬇️ Actualizando código (Git Pull)..."
          git fetch --all
          git reset --hard origin/muela
          
          # C. Login en Docker (Usando el Token Personal guardado en Secrets)
          echo "🔐 Login en GHCR..."
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u DavidVMuela --password-stdin
          
          # D. Descargar la imagen nueva
          echo "📥 Descargando imagen..."
          docker pull ghcr.io/davidvmuela/muela:1.0.5
          
          # E. Desplegar Stack
          # Nota: 'docker stack rm' causa tiempo de inactividad. 
          # Si puedes, usa solo 'docker stack deploy' para actualizar sin borrar.
          # Pero mantengo tu lógica por seguridad del examen:
          
          echo "🧹 Reiniciando Stack..."
          docker stack rm muela_stack || true
          sleep 10 # Esperar a que se liberen los puertos
          
          docker stack deploy --with-registry-auth -c stack.yml muela_stack
          
          echo "✅ Despliegue enviado. Esperando servicios..."
          sleep 10
          docker service ls