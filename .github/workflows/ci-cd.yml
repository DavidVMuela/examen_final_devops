name: CI/CD Muela Project

on:
  push:
    branches: ["muela"]
  pull_request:
    branches: ["muela"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # ---------------------------------------------------------
    # DESCARGAR REPOSITORIO
    # ---------------------------------------------------------
    - name: 📥 Checkout repo
      uses: actions/checkout@v4
    
    # ---------------------------------------------------------
    # CONFIGURAR PYTHON
    # ---------------------------------------------------------
    - name: 🐍 Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # ---------------------------------------------------------
    # FIX PARA QUE pytest ENCUENTRE app.py
    # ---------------------------------------------------------
    - name: 🛠️ Fix Python path
      run: echo "PYTHONPATH=." >> $GITHUB_ENV
    
    # ---------------------------------------------------------
    # EJECUTAR TESTS
    # ---------------------------------------------------------
    - name: 🧪 Run tests
      run: pytest test_app.py -v
    
    # ---------------------------------------------------------
    # LOGIN GHCR
    # ---------------------------------------------------------
    - name: 🔐 Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    # ---------------------------------------------------------
    # BUILD + PUSH DOCKER IMAGE
    # ---------------------------------------------------------
    - name: 🏗️ Build & Push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/davidvmuela/muela:1.0.5
          ghcr.io/davidvmuela/muela:latest
    
    # ---------------------------------------------------------
    # SUBIR stack.yml AL VPS
    # ---------------------------------------------------------
    - name: 📤 Upload stack to VPS
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/muela-app"
    
    # ---------------------------------------------------------
    # DEPLOY EN DOCKER SWARM
    # ---------------------------------------------------------
    - name: 🚀 Deploy to VPS using Docker Swarm
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          echo "🚀 INICIANDO DESPLIEGUE..."
          
          # Variables
          DIR="/home/${{ secrets.VPS_USER }}/muela-app"
          REPO="https://github.com/DavidVMuela/examen_final_devops.git"
          
          # 1. Clonar si no existe
          if [ ! -d "$DIR" ]; then
            echo "📂 Clonando repositorio..."
            git clone $REPO "$DIR"
          fi
          
          cd "$DIR"
          
          # 2. Actualizar código (Trae el stack.yml corregido)
          echo "⬇️ Actualizando desde rama 'muela'..."
          git fetch --all
          git reset --hard origin/muela
          
          # 3. Login Docker (Usando Token Personal)
          echo "🔐 Autenticando en GHCR..."
          # Asegúrate que el secreto se llame CR_PAT o GHCR_PAT
          echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u DavidVMuela --password-stdin
          
          # 4. Pull imagen nueva
          echo "📥 Descargando imagen..."
          docker pull ghcr.io/davidvmuela/muela:1.0.5
          
          # 5. Desplegar
          echo "🚢 Desplegando Stack..."
          # Limpiamos stack anterior (opcional, pero seguro)
          docker stack rm muela_stack || true
          sleep 10 
          
          docker stack deploy --with-registry-auth -c stack.yml muela_stack
          
          echo "✅ Despliegue completado."
          docker service ls