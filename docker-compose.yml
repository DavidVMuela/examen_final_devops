version: '3.8'

services:
  app:
    image: ghcr.io/DavidVMuela/villagomez:1.0.5
    ports:
      - "5000:5000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.villagomez.rule=Host(`villagomez.byronrm.com`)"
        - "traefik.http.routers.villagomez.entrypoints=websecure"
        - "traefik.http.routers.villagomez.tls.certresolver=letsencrypt"
        - "traefik.http.services.villagomez.loadbalancer.server.port=5000"

networks:
  traefik-public:
    external: true